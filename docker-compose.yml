name: marketpilot-ai

networks:
  marketpilot:
    driver: bridge

volumes:
  postgres_data:

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-marketpilot}
      POSTGRES_USER: ${POSTGRES_USER:-marketpilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-marketpilot}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    networks:
      - marketpilot
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-marketpilot} -d ${POSTGRES_DB:-marketpilot}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    networks:
      - marketpilot
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  api:
    build:
      context: ./apps/api
    restart: on-failure
    env_file:
      - .env
    environment:
      # Inside the Docker network, services always reach each other on
      # their container-internal port — POSTGRES_PORT/REDIS_PORT in .env
      # are host-side mappings only (for local tooling) and must not
      # leak into the api container's connection settings.
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    networks:
      - marketpilot
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0) if urllib.request.urlopen('http://localhost:8000/health/live', timeout=2).status == 200 else sys.exit(1)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  web:
    build:
      context: ./apps/web
    restart: on-failure
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:${API_PORT:-8000}
      # Next.js standalone's server.js binds to $HOSTNAME if set, and
      # Docker auto-injects HOSTNAME=<container id> for every container
      # (visible via `docker exec ... echo $HOSTNAME`) — that resolves
      # only to the container's own bridge-network IP, never to
      # loopback, so the image's own HEALTHCHECK (which curls
      # localhost:3000 from inside the container) fails permanently
      # even though the app is genuinely up and externally reachable
      # via the published port. Explicitly overriding HOSTNAME here
      # makes the server bind every interface, including loopback.
      HOSTNAME: "0.0.0.0"
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    networks:
      - marketpilot
    depends_on:
      api:
        condition: service_healthy
